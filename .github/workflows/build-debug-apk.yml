name: Build tablet keyboard APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - uses: gradle/actions/setup-gradle@v3

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK and NDK packages
        run: sdkmanager "platforms;android-37.0" "build-tools;37.0.0" "ndk;28.0.13004108"

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build APK
        run: ./gradlew :app:assembleDebugNoMinify

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: HeliBoard-German-Tablet-Keyboard
          path: app/build/outputs/apk/debugNoMinify/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Archive reports for failed job
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: '*/build/reports'
        if: ${{ failure() }}
